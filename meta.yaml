{% set version = "0.1.1" %}

package:
  name: r3cal
  version: 0.1.1

source:
  path: .  # Derlemeyi bu meta.yaml dosyasının bulunduğu dizinden yap
  url: 
  blake2b-256: 

channels:
  - conda-forge
  - bilgi

build:
  noarch: python  # Platformdan bağımsız bir paket oluşturur
  #script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed"
  script: "{{ PYTHON }} -m pip install . -vv"
  number: 0
  entry_points:
    - r3cal = r3cal.__main__:main

requirements:
  host:
    - python {{ python }}
    - numpy
    - pip
    - setuptools
    # Other build tools
  run:
    - python >=3.11
  build:
    - python >=3.11
    - pip
    - setuptools
    - numpy

test:
  requires:
    - python >=3.11
  imports:

about:
  home: https://github.com/WhiteSymmetry/r3cal
  license: AGPL-3.0-or-later
  summary: 'r3cal: Resistor Color Code Calculator: Direnç Renk Kodu Hesaplayıcı Modülü'
  description: |
    r3cal: Resistor Color Code Calculator: Direnç Renk Kodu Hesaplayıcı Modülü
  dev_url: https://github.com/WhiteSymmetry/r3cal
  doc_url: https://github.com/WhiteSymmetry/r3cal
  doc_source_url: https://github.com/WhiteSymmetry/r3cal/blob/main/README.md
